<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Two lanes: the server session owns server, database, deploy and docs; this session owns the client, assets and QA; they meet at the API contract, client build output flows to the server, QA reports flow back." font-family="system-ui, 'Noto Sans', 'DejaVu Sans', sans-serif">
<title>Crit 8 work split</title>
<defs><marker id="m-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2111"/></marker><marker id="m-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3f1d"/></marker><marker id="m-new" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="1000" height="560" fill="#ffffff"/>
<rect x="0" y="0" width="1000" height="64" fill="#fbf7e4"/>
<text x="40" y="40" font-size="21" font-weight="700" fill="#2b2111">Crit 8 work split</text>
<rect x="30" y="100" width="300" height="350" rx="12" fill="none" stroke="#6b3f1d" stroke-width="1.4" stroke-dasharray="3 5"/><text x="42" y="120" font-size="12" font-weight="600" fill="#6b3f1d">comp4020-a3, Opus  (server · DB · deploy · docs)</text><rect x="50" y="140" width="260" height="70" rx="8" fill="#ffffff" stroke="#2b2111" stroke-width="1.6"/><text x="180.0" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2111">Hono server + SQLite</text><text x="180.0" y="186" text-anchor="middle" font-size="12" fill="#2b2111">routes, validation, persistence</text><rect x="50" y="230" width="260" height="70" rx="8" fill="#ffffff" stroke="#2b2111" stroke-width="1.6"/><text x="180.0" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2111">Dockerfile · fly.toml · deploy</text><text x="180.0" y="276" text-anchor="middle" font-size="12" fill="#2b2111">only this side deploys</text><rect x="50" y="320" width="260" height="70" rx="8" fill="#ffffff" stroke="#2b2111" stroke-width="1.6"/><text x="180.0" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2111">README · PROCESS · CLAUDE.md</text><text x="180.0" y="366" text-anchor="middle" font-size="12" fill="#2b2111">only this side commits and pushes</text><rect x="670" y="100" width="300" height="350" rx="12" fill="none" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="3 5"/><text x="682" y="120" font-size="12" font-weight="600" fill="#0f766e">comp4020-6a, Sonnet  (3D client · assets · QA)</text><rect x="690" y="140" width="260" height="70" rx="8" fill="#f6ecb4" stroke="#2b2111" stroke-width="1.6"/><text x="820.0" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2111">Vite + Three.js client</text><text x="820.0" y="186" text-anchor="middle" font-size="12" fill="#2b2111">files only under client/</text><rect x="690" y="230" width="260" height="70" rx="8" fill="#f6ecb4" stroke="#2b2111" stroke-width="1.6"/><text x="820.0" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2111">CC0 assets + credits</text><text x="820.0" y="276" text-anchor="middle" font-size="12" fill="#2b2111">toilet model, favicon</text><rect x="690" y="320" width="260" height="70" rx="8" fill="#f6ecb4" stroke="#2b2111" stroke-width="1.6"/><text x="820.0" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2111">Headless-Chrome QA</text><text x="820.0" y="366" text-anchor="middle" font-size="12" fill="#2b2111">local server only, never fly.dev</text><rect x="390" y="125" width="220" height="120" rx="8" fill="#ffffff" stroke="#6b3f1d" stroke-width="2.4"/><text x="500.0" y="149" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2111">API contract</text><text x="500.0" y="171" text-anchor="middle" font-size="12" fill="#2b2111">POST /api/join</text><text x="500.0" y="189" text-anchor="middle" font-size="12" fill="#2b2111">GET  /api/poops</text><text x="500.0" y="207" text-anchor="middle" font-size="12" fill="#2b2111">POST /api/poop</text><text x="500.0" y="225" text-anchor="middle" font-size="12" fill="#2b2111">both sides code against it</text><polyline points="310,175 390,175" fill="none" stroke="#6b3f1d" stroke-width="1.8" marker-end="url(#m-acc)"/><polyline points="690,175 610,175" fill="none" stroke="#6b3f1d" stroke-width="1.8" marker-end="url(#m-acc)"/><polyline points="330,300 670,300" fill="none" stroke="#2b2111" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#m-ink)"/><text x="500" y="292" text-anchor="middle" font-size="11" font-weight="500" fill="#2b2111" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">tasks (server side to client side)</text><polyline points="670,345 330,345" fill="none" stroke="#0f766e" stroke-width="2.2" marker-end="url(#m-new)"/><text x="500" y="337" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">client/dist  (vite build)</text><polyline points="670,390 330,390" fill="none" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#m-new)"/><text x="500" y="382" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">QA verdicts + changed-file lists</text>
<text x="40" y="516" font-size="12.5" fill="#8a8478">One committer on purpose: the client side hands over a finished slice and a file list, and the server side</text><text x="40" y="534" font-size="12.5" fill="#8a8478">commits and deploys it. The API contract is the only thing both sides have to agree on.</text>
</svg>
