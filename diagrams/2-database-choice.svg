<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Left: app server and SQLite file inside one Fly machine. Right: app server plus separate paid Postgres and Redis services reached over the network." font-family="system-ui, 'Noto Sans', 'DejaVu Sans', sans-serif">
<title>Database choice: one file vs. extra services</title>
<defs><marker id="m-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2111"/></marker><marker id="m-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3f1d"/></marker><marker id="m-new" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="1000" height="560" fill="#ffffff"/>
<rect x="0" y="0" width="1000" height="64" fill="#fbf7e4"/>
<text x="40" y="40" font-size="21" font-weight="700" fill="#2b2111">Database choice: one file vs. extra services</text>
<text x="40" y="98" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e">A.  SQLite on the volume  (chosen)</text><text x="530" y="98" text-anchor="start" font-size="14" font-weight="700" fill="#b91c1c">B.  Postgres + Redis  (given up)</text><rect x="30" y="112" width="450" height="300" rx="12" fill="none" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="3 5"/><text x="42" y="132" font-size="12" font-weight="600" fill="#0f766e">Fly.io machine</text><rect x="60" y="180" width="160" height="110" rx="8" fill="#ffffff" stroke="#2b2111" stroke-width="1.6"/><text x="140.0" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2111">App server</text><text x="140.0" y="226" text-anchor="middle" font-size="12" fill="#2b2111">Node process</text><rect x="290" y="180" width="160" height="110" rx="8" fill="#f6ecb4" stroke="#2b2111" stroke-width="1.6"/><text x="370.0" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2111">app.db</text><text x="370.0" y="226" text-anchor="middle" font-size="12" fill="#2b2111">SQLite file</text><text x="370.0" y="244" text-anchor="middle" font-size="12" fill="#2b2111">on the /data volume</text><polyline points="220,235 290,235" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#m-new)" marker-start="url(#m-new)"/><text x="255" y="222" text-anchor="middle" font-size="11" font-weight="500" fill="#0f766e" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">library call</text><text x="255" y="254" text-anchor="middle" font-size="11" font-weight="500" fill="#0f766e" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">no network</text><text x="60" y="350" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f766e">1 process, 0 extra services, no extra bill</text><text x="60" y="370" text-anchor="start" font-size="12" font-weight="400" fill="#2b2111">file survives restarts and redeploys</text><rect x="520" y="112" width="220" height="150" rx="12" fill="none" stroke="#8a8478" stroke-width="1.4" stroke-dasharray="3 5"/><text x="532" y="132" font-size="12" font-weight="600" fill="#8a8478">Fly.io machine</text><rect x="545" y="150" width="170" height="90" rx="8" fill="#ffffff" stroke="#2b2111" stroke-width="1.6"/><text x="630.0" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2111">App server</text><text x="630.0" y="196" text-anchor="middle" font-size="12" fill="#2b2111">Node process</text><rect x="790" y="128" width="170" height="90" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="6 4"/><text x="875.0" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Managed Postgres</text><text x="875.0" y="174" text-anchor="middle" font-size="12" fill="#2b2111">separate service</text><text x="875.0" y="192" text-anchor="middle" font-size="12" fill="#2b2111">paid tier</text><rect x="790" y="258" width="170" height="90" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="6 4"/><text x="875.0" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Redis</text><text x="875.0" y="304" text-anchor="middle" font-size="12" fill="#2b2111">separate service</text><text x="875.0" y="322" text-anchor="middle" font-size="12" fill="#2b2111">paid tier</text><polyline points="715,185 790,175" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#m-bad)" marker-start="url(#m-bad)"/><text x="752" y="152" text-anchor="middle" font-size="11" font-weight="500" fill="#b91c1c" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">network hop</text><polyline points="630,240 630,303 790,303" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#m-bad)" marker-start="url(#m-bad)"/><text x="710" y="295" text-anchor="middle" font-size="11" font-weight="500" fill="#b91c1c" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">pub/sub</text><text x="540" y="392" text-anchor="start" font-size="12" font-weight="400" fill="#2b2111">Redis only pays off when several servers must share</text><text x="540" y="410" text-anchor="start" font-size="12" font-weight="400" fill="#2b2111">messages. One machine keeps positions in memory,</text><text x="540" y="428" text-anchor="start" font-size="12" font-weight="400" fill="#2b2111">so there is nothing to share.</text><text x="540" y="460" text-anchor="start" font-size="12" font-weight="600" fill="#b91c1c">Also: two extra services to run, pay for and recover</text>
<text x="40" y="516" font-size="12.5" fill="#8a8478">What the app stores (names and poop spots now, items later) is small and relational, and the course template allows</text><text x="40" y="534" font-size="12.5" fill="#8a8478">one small machine and one volume. B adds services, hops and a bill without solving a problem A has.</text>
</svg>
