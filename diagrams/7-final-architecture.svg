<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-label="Browsers keep a WebSocket and call the HTTPS API of one Node server on a Fly.io machine, which stores app data and a full-text index of crawled ANU pages in SQLite on its volume. The server signs S3 links so browsers move files directly, sends codes through SES, asks Bedrock (Claude Haiku 4.5 or Nova 2 Lite) only with matching crawled pages, and hands out LiveKit tickets for voice on EC2. GitHub Actions checks and deploys every push to main." font-family="system-ui, 'Noto Sans', 'DejaVu Sans', sans-serif">
<title>Final project: the whole architecture</title><defs><marker id="m-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2111"/></marker><marker id="m-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3f1d"/></marker><marker id="m-aws" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="m-new" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="1500" height="1080" fill="#ffffff"/><rect width="1500" height="64" fill="#fbf7e4"/>
<text x="40" y="40" font-size="21" font-weight="700" fill="#2b2111">Final: the whole architecture (browsers, one Fly server, SQLite, AWS)</text>
<rect x="30" y="120" width="260" height="250" rx="8" fill="#f6ecb4" stroke="#2b2111" stroke-width="1.6"/><text x="160.0" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2111">Browsers (PC and phone)</text><text x="160.0" y="168" text-anchor="middle" font-size="13" fill="#2b2111">Vite + Three.js client</text><text x="160.0" y="187" text-anchor="middle" font-size="13" fill="#2b2111">one WebSocket per tab</text><text x="160.0" y="206" text-anchor="middle" font-size="13" fill="#2b2111"></text><text x="160.0" y="225" text-anchor="middle" font-size="13" fill="#2b2111">keyboard, touch, minimap</text><text x="160.0" y="244" text-anchor="middle" font-size="13" fill="#2b2111">day/night by Canberra time</text><text x="160.0" y="263" text-anchor="middle" font-size="13" fill="#2b2111">S3 uploads go direct</text><text x="160.0" y="282" text-anchor="middle" font-size="13" fill="#2b2111">voice via LiveKit SDK</text><rect x="30" y="760" width="260" height="150" rx="8" fill="#eef2f7" stroke="#2b2111" stroke-width="1.6"/><text x="160.0" y="784" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2111">GitHub (main)</text><text x="160.0" y="808" text-anchor="middle" font-size="13" fill="#2b2111">push = deploy</text><text x="160.0" y="827" text-anchor="middle" font-size="13" fill="#2b2111">Actions: build, pnpm check,</text><text x="160.0" y="846" text-anchor="middle" font-size="13" fill="#2b2111">check:evidence, secret scan</text><text x="160.0" y="865" text-anchor="middle" font-size="13" fill="#2b2111">then flyctl deploy</text><rect x="380" y="96" width="520" height="880" rx="12" fill="none" stroke="#6b3f1d" stroke-width="1.4" stroke-dasharray="4 4"/><text x="394" y="118" font-size="14" font-weight="700" fill="#6b3f1d">Fly.io (course-provided), one machine</text><rect x="410" y="130" width="460" height="300" rx="8" fill="#fbf7e4" stroke="#2b2111" stroke-width="1.6"/><text x="640.0" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2111">Node 24 server (Hono)</text><text x="640.0" y="178" text-anchor="middle" font-size="13" fill="#2b2111">HTTP: JSON API, /readme/, /credits/, admin page</text><text x="640.0" y="197" text-anchor="middle" font-size="13" fill="#2b2111">realtime.ts: WebSocket rooms per space</text><text x="640.0" y="216" text-anchor="middle" font-size="13" fill="#2b2111">(moves, chat, emotes, notes, rooms)</text><text x="640.0" y="235" text-anchor="middle" font-size="13" fill="#2b2111">rules checked here, never trusted to the client</text><text x="640.0" y="254" text-anchor="middle" font-size="13" fill="#2b2111"></text><text x="640.0" y="273" text-anchor="middle" font-size="13" fill="#2b2111">npcs.ts: AI assistants (limits: 30 per person,</text><text x="640.0" y="292" text-anchor="middle" font-size="13" fill="#2b2111">50 per assistant per day)</text><text x="640.0" y="311" text-anchor="middle" font-size="13" fill="#2b2111">voice.ts: signs a short LiveKit ticket</text><text x="640.0" y="330" text-anchor="middle" font-size="13" fill="#2b2111">files.ts: signs 5-minute S3 links</text><text x="640.0" y="349" text-anchor="middle" font-size="13" fill="#2b2111">mail.ts: sign-up and reset codes</text><rect x="410" y="500" width="215" height="190" rx="8" fill="#fbf7e4" stroke="#2b2111" stroke-width="1.6"/><text x="517.5" y="524" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2111">/data/app.db</text><text x="517.5" y="548" text-anchor="middle" font-size="13" fill="#2b2111">SQLite (WAL)</text><text x="517.5" y="567" text-anchor="middle" font-size="13" fill="#2b2111">accounts, notes, posts,</text><text x="517.5" y="586" text-anchor="middle" font-size="13" fill="#2b2111">rooms, 7-day admin log</text><text x="517.5" y="605" text-anchor="middle" font-size="13" fill="#2b2111">chat kept one day</text><rect x="655" y="500" width="215" height="190" rx="8" fill="#fbf7e4" stroke="#2b2111" stroke-width="1.6"/><text x="762.5" y="524" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2111">/data/knowledge.db</text><text x="762.5" y="548" text-anchor="middle" font-size="13" fill="#2b2111">SQLite FTS5</text><text x="762.5" y="567" text-anchor="middle" font-size="13" fill="#2b2111">8,747 crawled pages</text><text x="762.5" y="586" text-anchor="middle" font-size="13" fill="#2b2111">of public ANU sites</text><text x="762.5" y="605" text-anchor="middle" font-size="13" fill="#2b2111">re-crawled monthly</text><rect x="410" y="760" width="460" height="150" rx="8" fill="#fbf7e4" stroke="#2b2111" stroke-width="1.6"/><text x="640.0" y="784" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2111">How an assistant answers</text><text x="640.0" y="808" text-anchor="middle" font-size="13" fill="#2b2111">question → FTS5 finds matching pieces</text><text x="640.0" y="827" text-anchor="middle" font-size="13" fill="#2b2111">no piece → "I couldn't find that" + link (no model call)</text><text x="640.0" y="846" text-anchor="middle" font-size="13" fill="#2b2111">pieces + question → Bedrock → answer with sources</text><text x="640.0" y="865" text-anchor="middle" font-size="13" fill="#2b2111">the question is not stored</text><rect x="990" y="96" width="480" height="880" rx="12" fill="none" stroke="#b45309" stroke-width="1.4" stroke-dasharray="4 4"/><text x="1004" y="118" font-size="14" font-weight="700" fill="#b45309">AWS (added by me), ap-southeast-2, one IAM user</text><rect x="1020" y="130" width="420" height="120" rx="8" fill="#fdf0e0" stroke="#2b2111" stroke-width="1.6"/><text x="1230.0" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2111">S3 (private bucket)</text><text x="1230.0" y="178" text-anchor="middle" font-size="13" fill="#2b2111">files up to 200 MB, 30-day expiry</text><text x="1230.0" y="197" text-anchor="middle" font-size="13" fill="#2b2111">browser PUT/GET with a signed link</text><rect x="1020" y="290" width="420" height="110" rx="8" fill="#fdf0e0" stroke="#2b2111" stroke-width="1.6"/><text x="1230.0" y="314" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2111">SES</text><text x="1230.0" y="338" text-anchor="middle" font-size="13" fill="#2b2111">six-digit sign-up and reset codes</text><text x="1230.0" y="357" text-anchor="middle" font-size="13" fill="#2b2111">to @anu.edu.au addresses</text><rect x="1020" y="440" width="420" height="130" rx="8" fill="#fdf0e0" stroke="#2b2111" stroke-width="1.6"/><text x="1230.0" y="464" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2111">Bedrock</text><text x="1230.0" y="488" text-anchor="middle" font-size="13" fill="#2b2111">Claude Haiku 4.5: courses, careers, housing</text><text x="1230.0" y="507" text-anchor="middle" font-size="13" fill="#2b2111">Amazon Nova 2 Lite: the rest</text><text x="1230.0" y="526" text-anchor="middle" font-size="13" fill="#2b2111">InvokeModel only</text><rect x="1020" y="610" width="420" height="110" rx="8" fill="#fdf0e0" stroke="#2b2111" stroke-width="1.6"/><text x="1230.0" y="634" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2111">EC2: LiveKit (voice)</text><text x="1230.0" y="658" text-anchor="middle" font-size="13" fill="#2b2111">media relayed here, nothing recorded</text><text x="1230.0" y="677" text-anchor="middle" font-size="13" fill="#2b2111">never passes through the app server</text><rect x="1020" y="760" width="420" height="110" rx="8" fill="#fdf0e0" stroke="#2b2111" stroke-width="1.6"/><text x="1230.0" y="784" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2111">Budgets</text><text x="1230.0" y="808" text-anchor="middle" font-size="13" fill="#2b2111">monthly alert e-mails to me</text><text x="1230.0" y="827" text-anchor="middle" font-size="13" fill="#2b2111">(warns only, so the app's own</text><text x="1230.0" y="846" text-anchor="middle" font-size="13" fill="#2b2111">limits are what stop spending)</text><line x1="290" y1="200" x2="410" y2="200" stroke="#2b2111" stroke-width="2.2" marker-start="url(#m-ink)" marker-end="url(#m-ink)"/><text x="350.0" y="192.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2b2111">WebSocket</text><line x1="290" y1="250" x2="410" y2="250" stroke="#2b2111" stroke-width="2.2" marker-start="url(#m-ink)" marker-end="url(#m-ink)"/><text x="350.0" y="242.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2b2111">HTTPS (API)</text><polyline points="160,120 160,78 1400,78 1400,128" fill="none" stroke="#0f766e" stroke-width="2.2" marker-end="url(#m-new)"/><text x="700" y="73" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f766e">browser ↔ S3 directly, with a signed link</text><polyline points="290,330 340,330 340,945 950,945 950,665 1020,665" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#m-new)"/><text x="645" y="937" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f766e">voice (WebRTC), with a ticket from the server</text><line x1="870" y1="190" x2="1020" y2="200" stroke="#b45309" stroke-width="2.2" marker-end="url(#m-aws)"/><text x="945.0" y="187.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b45309">sign</text><line x1="870" y1="345" x2="1020" y2="345" stroke="#b45309" stroke-width="2.2" marker-end="url(#m-aws)"/><text x="945.0" y="337.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b45309">send code</text><line x1="870" y1="400" x2="1020" y2="490" stroke="#b45309" stroke-width="2.2" marker-end="url(#m-aws)"/><text x="935" y="430" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b45309">Converse</text><line x1="517" y1="430" x2="517" y2="500" stroke="#6b3f1d" stroke-width="2.2" marker-end="url(#m-acc)"/><line x1="762" y1="430" x2="762" y2="500" stroke="#6b3f1d" stroke-width="2.2" marker-end="url(#m-acc)"/><line x1="762" y1="690" x2="762" y2="760" stroke="#6b3f1d" stroke-width="2.2" marker-end="url(#m-acc)"/><text x="800" y="730" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6b3f1d">search</text><line x1="290" y1="835" x2="410" y2="700" stroke="#2b2111" stroke-width="2.2" marker-end="url(#m-ink)"/><text x="330" y="750" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2b2111">deploy</text><line x1="40" y1="1005" x2="80" y2="1005" stroke="#2b2111" stroke-width="3"/><text x="92" y="1010" font-size="13" fill="#2b2111">my code / browser ↔ server</text><line x1="740" y1="1005" x2="780" y2="1005" stroke="#6b3f1d" stroke-width="3"/><text x="792" y="1010" font-size="13" fill="#2b2111">inside the Fly machine</text><line x1="40" y1="1031" x2="80" y2="1031" stroke="#b45309" stroke-width="3"/><text x="92" y="1036" font-size="13" fill="#2b2111">server → AWS (one IAM user, keys only in Fly secrets)</text><line x1="740" y1="1031" x2="780" y2="1031" stroke="#0f766e" stroke-width="3"/><text x="792" y="1036" font-size="13" fill="#2b2111">browser → AWS directly</text></svg>