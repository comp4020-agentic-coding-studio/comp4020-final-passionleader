<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#5a4128" flood-opacity="0.13"/></filter><marker id="m8a5a2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a2b"/></marker><marker id="m8a5a2bs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8a5a2b"/></marker><marker id="m0f8a7e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f8a7e"/></marker><marker id="m0f8a7es" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0f8a7e"/></marker><marker id="m5f5246" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f5246"/></marker><marker id="m5f5246s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5f5246"/></marker></defs><rect width="1600" height="1000" fill="#fbf7ee"/><rect width="1600" height="78" fill="#f3e9d6"/><rect y="78" width="1600" height="2" fill="#e2d2b4"/><text x="36" y="38" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#2b2118">11 · Voice chat: a ticket from the app, audio through my LiveKit server</text><text x="36" y="63" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#5f5246">The app decides who may talk where; the audio itself never touches the app server, and nothing is recorded</text><text x="1564" y="38" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5f5246" text-anchor="end">ANU Crossing (unofficial) · final project</text><rect x="70" y="110" width="320" height="64" rx="12" fill="#f3f6fb" stroke="#4f72ad" stroke-width="1.8"/><image x="86" y="122" width="40" height="40" href="data:image/svg+xml;base64,"/><text x="248" y="150" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#4f72ad" text-anchor="middle">Ana&#x27;s browser</text><line x1="230" y1="174" x2="230" y2="760" stroke="#4f72ad" stroke-width="2" stroke-dasharray="3 6" opacity="0.7"/><rect x="450" y="110" width="320" height="64" rx="12" fill="#fbf5ea" stroke="#8a5a2b" stroke-width="1.8"/><text x="610" y="150" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#8a5a2b" text-anchor="middle">App server (Fly)</text><line x1="610" y1="174" x2="610" y2="760" stroke="#8a5a2b" stroke-width="2" stroke-dasharray="3 6" opacity="0.7"/><rect x="830" y="110" width="320" height="64" rx="12" fill="#fff3e6" stroke="#e07a10" stroke-width="1.8"/><image x="846" y="122" width="40" height="40" href="data:image/svg+xml;base64,"/><text x="1008" y="150" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#e07a10" text-anchor="middle">LiveKit on EC2</text><line x1="990" y1="174" x2="990" y2="760" stroke="#e07a10" stroke-width="2" stroke-dasharray="3 6" opacity="0.7"/><rect x="1210" y="110" width="320" height="64" rx="12" fill="#f3f6fb" stroke="#4f72ad" stroke-width="1.8"/><image x="1226" y="122" width="40" height="40" href="data:image/svg+xml;base64,"/><text x="1388" y="150" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#4f72ad" text-anchor="middle">Ben&#x27;s browser</text><line x1="1370" y1="174" x2="1370" y2="760" stroke="#4f72ad" stroke-width="2" stroke-dasharray="3 6" opacity="0.7"/><path d="M230,215 L602,215" fill="none" stroke="#8a5a2b" stroke-width="2.2" marker-end="url(#m8a5a2b)" stroke-linejoin="round"/><text x="420.0" y="205" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8a5a2b" text-anchor="middle">POST /api/voice  (name + token)</text><circle cx="278.635" cy="200" r="12" fill="#8a5a2b"/><text x="278.635" y="204.6" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><path d="M610,375 L238,375" fill="none" stroke="#8a5a2b" stroke-width="2.2" marker-end="url(#m8a5a2b)" stroke-linejoin="round"/><text x="420.0" y="365" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8a5a2b" text-anchor="middle">ticket: room + JWT (2 minutes)</text><circle cx="282.55" cy="360" r="12" fill="#8a5a2b"/><text x="282.55" y="364.6" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><path d="M230,420 L982,420" fill="none" stroke="#0f8a7e" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#m0f8a7e)" stroke-linejoin="round"/><text x="610.0" y="410" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f8a7e" text-anchor="middle">connect wss://voice.passionleader.click  (Caddy TLS on 443)</text><circle cx="359.015" cy="405" r="12" fill="#0f8a7e"/><text x="359.015" y="409.6" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><path d="M1370,480 L998,480" fill="none" stroke="#0f8a7e" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#m0f8a7e)" stroke-linejoin="round"/><text x="1180.0" y="470" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f8a7e" text-anchor="middle">Ben does the same for the same room</text><circle cx="1022.9749999999999" cy="465" r="12" fill="#0f8a7e"/><text x="1022.9749999999999" y="469.6" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><path d="M230,555 L982,555" fill="none" stroke="#0f8a7e" stroke-width="2.2" marker-end="url(#m0f8a7e)" stroke-linejoin="round"/><text x="610.0" y="545" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f8a7e" text-anchor="middle">Ana talks: WebRTC audio (UDP, or TURN / TCP fallback)</text><circle cx="382.505" cy="540" r="12" fill="#0f8a7e"/><text x="382.505" y="544.6" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text><path d="M990,615 L1362,615" fill="none" stroke="#0f8a7e" stroke-width="2.2" marker-end="url(#m0f8a7e)" stroke-linejoin="round"/><text x="1180.0" y="605" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f8a7e" text-anchor="middle">forwarded to the room, not recorded</text><circle cx="1022.9749999999999" cy="600" r="12" fill="#0f8a7e"/><text x="1022.9749999999999" y="604.6" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text><path d="M230,690 L982,690" fill="none" stroke="#5f5246" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#m5f5246)" stroke-linejoin="round"/><text x="610.0" y="680" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#5f5246" text-anchor="middle">Ana leaves the room or walks indoors → disconnect</text><circle cx="398.165" cy="675" r="12" fill="#8c8c8c"/><text x="398.165" y="679.6" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">7</text><rect x="470" y="235" width="280" height="88" rx="10" fill="#fff" stroke="#8a5a2b" stroke-width="1.6" filter="url(#sh)"/><circle cx="490" cy="255" r="12" fill="#8a5a2b"/><text x="490" y="259.6" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="508" y="260" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#2b2118" text-anchor="start">the server checks</text><text x="486" y="282" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5246" text-anchor="start">in a meeting room? inside it this sitting</text><text x="486" y="300" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5246" text-anchor="start">outside? in the outdoor space · chat ban?</text><text x="486" y="317" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5246" text-anchor="start">signs with the secret in Fly secrets</text><rect x="70" y="790" width="470" height="180" rx="10" fill="#fff" stroke="#8a5a2b" stroke-width="1.4"/><rect x="70" y="790" width="6" height="180" rx="3" fill="#8a5a2b"/><text x="88" y="814" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#8a5a2b" text-anchor="start">Which room the ticket opens</text><text x="88" y="836" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start"><tspan font-weight="700" fill="#2b2118">meeting room  </tspan><tspan font-weight="400" fill="#5f5246">room-&lt;space&gt;-&lt;sitting&gt;</tspan></text><text x="88" y="855" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">  so the six-person cap and invitations hold</text><text x="88" y="874" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start"><tspan font-weight="700" fill="#2b2118">outside  </tspan><tspan font-weight="400" fill="#5f5246">space-outdoor</tspan></text><text x="88" y="893" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">  hold V to talk; quieter with distance,</text><text x="88" y="912" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">  silent past 18 m (done in the browser)</text><text x="88" y="931" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">anywhere else: refused, and logged</text><rect x="565" y="790" width="470" height="180" rx="10" fill="#fff" stroke="#0f8a7e" stroke-width="1.4"/><rect x="565" y="790" width="6" height="180" rx="3" fill="#0f8a7e"/><text x="583" y="814" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#0f8a7e" text-anchor="start">What keeps it private</text><text x="583" y="836" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">the ticket is for one room and expires in 2 min</text><text x="583" y="855" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">the app server never sees the audio</text><text x="583" y="874" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">LiveKit relays only; no recording is set up</text><text x="583" y="893" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">the log notes who joined which voice, never words</text><text x="583" y="912" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">Mute silences someone&#x27;s voice for you</text><text x="583" y="931" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">Voices volume at 0 turns voice off</text><rect x="1060" y="790" width="470" height="180" rx="10" fill="#fff" stroke="#e07a10" stroke-width="1.4"/><rect x="1060" y="790" width="6" height="180" rx="3" fill="#e07a10"/><text x="1078" y="814" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#e07a10" text-anchor="start">Why my own server</text><text x="1078" y="836" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">audio is heavy; the 256 MB app machine</text><text x="1078" y="855" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">keeps to the app, and voice gets its own</text><text x="1078" y="874" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">small server that I run myself</text><text x="1078" y="893" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="start"><tspan font-weight="700" fill="#2b2118">Cost: </tspan><tspan font-weight="400" fill="#5f5246">one more server to keep up and secure</tspan></text><text x="1078" y="912" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">(ports and DNS in diagram 10)</text></svg>