<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Browser calls three API routes on a Hono server running on one Fly machine; the server upserts and reads poops in a SQLite file on the volume." font-family="system-ui, 'Noto Sans', 'DejaVu Sans', sans-serif">
<title>Crit 8: how one poop travels</title>
<defs><marker id="m-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2111"/></marker><marker id="m-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3f1d"/></marker><marker id="m-new" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="1000" height="560" fill="#ffffff"/>
<rect x="0" y="0" width="1000" height="64" fill="#fbf7e4"/>
<text x="40" y="40" font-size="21" font-weight="700" fill="#2b2111">Crit 8: how one poop travels</text>
<rect x="500" y="96" width="470" height="350" rx="12" fill="none" stroke="#8a8478" stroke-width="1.4" stroke-dasharray="3 5"/><text x="512" y="116" font-size="12" font-weight="600" fill="#8a8478">Fly.io machine  (one small machine, one volume)</text><rect x="30" y="150" width="220" height="250" rx="8" fill="#f6ecb4" stroke="#2b2111" stroke-width="1.6"/><text x="140.0" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2111">Browser</text><text x="140.0" y="196" text-anchor="middle" font-size="12" fill="#2b2111">Vite + Three.js client</text><text x="140.0" y="214" text-anchor="middle" font-size="12" fill="#2b2111">join modal · room · D-pad</text><text x="140.0" y="232" text-anchor="middle" font-size="12" fill="#2b2111">Space = poop</text><text x="140.0" y="250" text-anchor="middle" font-size="12" fill="#2b2111">localStorage: name + token</text><rect x="530" y="150" width="200" height="250" rx="8" fill="#ffffff" stroke="#2b2111" stroke-width="1.6"/><text x="630.0" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2111">Hono server (Node)</text><text x="630.0" y="196" text-anchor="middle" font-size="12" fill="#2b2111">serves client/dist at  /</text><text x="630.0" y="214" text-anchor="middle" font-size="12" fill="#2b2111">POST /api/join</text><text x="630.0" y="232" text-anchor="middle" font-size="12" fill="#2b2111">GET  /api/poops</text><text x="630.0" y="250" text-anchor="middle" font-size="12" fill="#2b2111">POST /api/poop</text><rect x="790" y="190" width="160" height="170" rx="8" fill="#f6ecb4" stroke="#2b2111" stroke-width="1.6"/><text x="870.0" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2111">SQLite file</text><text x="870.0" y="236" text-anchor="middle" font-size="12" fill="#2b2111">on the /data volume</text><text x="870.0" y="254" text-anchor="middle" font-size="12" fill="#2b2111">one poop row</text><text x="870.0" y="272" text-anchor="middle" font-size="12" fill="#2b2111">per user (updated,</text><text x="870.0" y="290" text-anchor="middle" font-size="12" fill="#2b2111">never duplicated)</text><polyline points="250,200 530,200" fill="none" stroke="#2b2111" stroke-width="1.8" marker-end="url(#m-ink)"/><text x="390" y="192" text-anchor="middle" font-size="12" font-weight="500" fill="#2b2111" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">POST /api/join {name, token?}</text><text x="390" y="218" text-anchor="middle" font-size="11" font-weight="500" fill="#8a8478" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">→ {name, token}</text><polyline points="250,282 530,282" fill="none" stroke="#2b2111" stroke-width="1.8" marker-end="url(#m-ink)"/><text x="390" y="274" text-anchor="middle" font-size="12" font-weight="500" fill="#2b2111" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">GET /api/poops</text><text x="390" y="300" text-anchor="middle" font-size="11" font-weight="500" fill="#8a8478" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">→ [{name, x, z}]</text><polyline points="250,364 530,364" fill="none" stroke="#6b3f1d" stroke-width="2.6" marker-end="url(#m-acc)"/><text x="390" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#6b3f1d" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">POST /api/poop {token, x, z}</text><text x="390" y="382" text-anchor="middle" font-size="11" font-weight="500" fill="#8a8478" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">→ saved poop (x, z clamped to ±10)</text><polyline points="730,250 790,250" fill="none" stroke="#6b3f1d" stroke-width="2.6" marker-end="url(#m-acc)"/><text x="760" y="236" text-anchor="middle" font-size="11" font-weight="700" fill="#6b3f1d" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">upsert</text><polyline points="790,310 730,310" fill="none" stroke="#2b2111" stroke-width="1.8" marker-end="url(#m-ink)"/><text x="760" y="330" text-anchor="middle" font-size="11" font-weight="500" fill="#2b2111" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">read all</text>
<text x="40" y="516" font-size="12.5" fill="#8a8478">The poop is written to SQLite the moment Space is pressed, and every page load reads all poops back,</text><text x="40" y="534" font-size="12.5" fill="#8a8478">so the map is the same after a reload. No realtime channel yet; the server also serves the built client.</text>
</svg>
