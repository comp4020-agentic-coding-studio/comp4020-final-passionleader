<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Left: one browser talks REST to a server that writes SQLite on every poop. Right: two browsers connect by WebSocket to a server holding positions in memory, writing SQLite only occasionally." font-family="system-ui, 'Noto Sans', 'DejaVu Sans', sans-serif">
<title>From crit 8 to the final project</title>
<defs><marker id="m-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2111"/></marker><marker id="m-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b3f1d"/></marker><marker id="m-new" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="1000" height="560" fill="#ffffff"/>
<rect x="0" y="0" width="1000" height="64" fill="#fbf7e4"/>
<text x="40" y="40" font-size="21" font-weight="700" fill="#2b2111">From crit 8 to the final project</text>
<text x="40" y="98" text-anchor="start" font-size="14" font-weight="700" fill="#2b2111">Crit 8  (now): REST, write on poop</text><text x="530" y="98" text-anchor="start" font-size="14" font-weight="700" fill="#0f766e">Final project  (next): realtime</text><rect x="130" y="120" width="200" height="70" rx="8" fill="#f6ecb4" stroke="#2b2111" stroke-width="1.6"/><text x="230.0" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2111">Browser</text><text x="230.0" y="166" text-anchor="middle" font-size="12" fill="#2b2111">one player</text><rect x="130" y="250" width="200" height="90" rx="8" fill="#ffffff" stroke="#2b2111" stroke-width="1.6"/><text x="230.0" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2111">Server</text><text x="230.0" y="296" text-anchor="middle" font-size="12" fill="#2b2111">REST routes</text><rect x="130" y="400" width="200" height="60" rx="8" fill="#f6ecb4" stroke="#2b2111" stroke-width="1.6"/><text x="230.0" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2111">SQLite</text><polyline points="230,190 230,250" fill="none" stroke="#2b2111" stroke-width="1.8" marker-end="url(#m-ink)"/><text x="244" y="226" text-anchor="start" font-size="11" font-weight="500" fill="#2b2111" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">join / poop / poops</text><polyline points="230,340 230,400" fill="none" stroke="#6b3f1d" stroke-width="2.4" marker-end="url(#m-acc)"/><text x="244" y="376" text-anchor="start" font-size="11" font-weight="700" fill="#6b3f1d" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">write on every poop</text><rect x="540" y="120" width="170" height="70" rx="8" fill="#f6ecb4" stroke="#2b2111" stroke-width="1.6"/><text x="625.0" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2111">Browser A</text><rect x="790" y="120" width="170" height="70" rx="8" fill="#f6ecb4" stroke="#2b2111" stroke-width="1.6"/><text x="875.0" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2111">Browser B</text><rect x="560" y="250" width="380" height="124" rx="8" fill="#ffffff" stroke="#2b2111" stroke-width="1.6"/><text x="750.0" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2111">Server</text><text x="750.0" y="296" text-anchor="middle" font-size="12" fill="#2b2111">positions: Map&lt;playerId, {x, y, z, rot}&gt;</text><text x="750.0" y="314" text-anchor="middle" font-size="12" fill="#2b2111">in memory, never written to the DB</text><text x="750.0" y="332" text-anchor="middle" font-size="12" fill="#2b2111">broadcast to every player 10-20x per second</text><text x="750.0" y="350" text-anchor="middle" font-size="12" fill="#2b2111">chat messages also go over the socket</text><rect x="640" y="410" width="220" height="50" rx="8" fill="#f6ecb4" stroke="#2b2111" stroke-width="1.6"/><text x="750.0" y="434" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2111">SQLite</text><polyline points="625,190 625,250" fill="none" stroke="#0f766e" stroke-width="2.4" marker-end="url(#m-new)" marker-start="url(#m-new)"/><text x="639" y="226" text-anchor="start" font-size="11" font-weight="700" fill="#0f766e" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">WebSocket</text><polyline points="875,190 875,250" fill="none" stroke="#0f766e" stroke-width="2.4" marker-end="url(#m-new)" marker-start="url(#m-new)"/><text x="861" y="226" text-anchor="end" font-size="11" font-weight="700" fill="#0f766e" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">WebSocket</text><polyline points="750,374 750,410" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#m-new)"/><text x="764" y="396" text-anchor="start" font-size="11" font-weight="700" fill="#0f766e" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">on disconnect / every few s</text><line x1="470" y1="90" x2="470" y2="470" stroke="#8a8478" stroke-width="1" stroke-dasharray="2 6"/>
<text x="40" y="516" font-size="12.5" fill="#8a8478">Teal marks what the final project adds: a WebSocket per player and a positions map held in server memory.</text><text x="40" y="534" font-size="12.5" fill="#8a8478">SQLite stays, but moves off the hot path (written on disconnect or every few seconds, not per move).</text>
</svg>
