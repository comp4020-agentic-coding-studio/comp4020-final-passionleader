<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1075" viewBox="0 0 1600 1075"><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#5a4128" flood-opacity="0.13"/></filter><marker id="m8a5a2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a2b"/></marker><marker id="m8a5a2bs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8a5a2b"/></marker><marker id="md96b00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d96b00"/></marker><marker id="md96b00s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d96b00"/></marker><marker id="m0f8a7e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f8a7e"/></marker><marker id="m0f8a7es" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0f8a7e"/></marker></defs><rect width="1600" height="1075" fill="#fbf7ee"/><rect width="1600" height="78" fill="#f3e9d6"/><rect y="78" width="1600" height="2" fill="#e2d2b4"/><text x="36" y="38" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#2b2118">12 · Signing up with an ANU email, step by step</text><text x="36" y="63" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#5f5246">Three requests to the server and one email through SES. The code is never stored, only its hash</text><text x="1564" y="38" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5f5246" text-anchor="end">ANU Crossing (unofficial) · final project</text><rect x="60" y="105" width="330" height="62" rx="12" fill="#f3f6fb" stroke="#4f72ad" stroke-width="1.8"/><image x="74" y="116" width="40" height="40" href="data:image/svg+xml;base64,"/><text x="243" y="143" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#4f72ad" text-anchor="middle">Browser (sign-up form)</text><line x1="225" y1="167" x2="225" y2="905" stroke="#4f72ad" stroke-width="2" stroke-dasharray="3 6" opacity="0.7"/><rect x="430" y="105" width="330" height="62" rx="12" fill="#fbf5ea" stroke="#8a5a2b" stroke-width="1.8"/><text x="595" y="143" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#8a5a2b" text-anchor="middle">App server (Fly)</text><line x1="595" y1="167" x2="595" y2="905" stroke="#8a5a2b" stroke-width="2" stroke-dasharray="3 6" opacity="0.7"/><rect x="800" y="105" width="330" height="62" rx="12" fill="#f4ecdc" stroke="#8a5a2b" stroke-width="1.8"/><text x="965" y="143" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#8a5a2b" text-anchor="middle">app.db (SQLite)</text><line x1="965" y1="167" x2="965" y2="905" stroke="#8a5a2b" stroke-width="2" stroke-dasharray="3 6" opacity="0.7"/><rect x="1170" y="105" width="330" height="62" rx="12" fill="#fff3e6" stroke="#e07a10" stroke-width="1.8"/><image x="1184" y="116" width="40" height="40" href="data:image/svg+xml;base64,"/><text x="1353" y="143" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#e07a10" text-anchor="middle">SES → ANU inbox</text><line x1="1335" y1="167" x2="1335" y2="905" stroke="#e07a10" stroke-width="2" stroke-dasharray="3 6" opacity="0.7"/><rect x="30" y="180" width="1540" height="290" rx="10" fill="#f3e9d6" opacity="0.35"/><text x="1556" y="200" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#5f5246" text-anchor="end">A · ask for a code   POST /api/signup/start</text><rect x="30" y="480" width="1540" height="175" rx="10" fill="#e8f1ee" opacity="0.35"/><text x="1556" y="500" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#5f5246" text-anchor="end">B · check the code   POST /api/signup/check</text><rect x="30" y="665" width="1540" height="235" rx="10" fill="#eef3fb" opacity="0.35"/><text x="1556" y="685" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#5f5246" text-anchor="end">C · finish   POST /api/signup/finish</text><path d="M225,225 L587,225" fill="none" stroke="#8a5a2b" stroke-width="2.2" marker-end="url(#m8a5a2b)" stroke-linejoin="round"/><text x="410.0" y="215" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8a5a2b" text-anchor="middle">student number (u1234567), or staff email</text><circle cx="229.485" cy="210" r="12" fill="#8a5a2b"/><text x="229.485" y="214.6" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="440" y="240" width="310" height="112" rx="10" fill="#fff" stroke="#8a5a2b" stroke-width="1.5" filter="url(#sh)"/><circle cx="458" cy="260" r="11" fill="#8a5a2b"/><text x="458" y="264.6" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="476" y="265" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#2b2118" text-anchor="start">checks before sending</text><text x="454" y="286" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5246" text-anchor="start">an ANU address? not signed up yet?</text><text x="454" y="304" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5246" text-anchor="start">≤ 5 codes an hour from one IP,</text><text x="454" y="322" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5246" text-anchor="start">≤ 200 an hour in all · 1 a minute each</text><path d="M595,385 L957,385" fill="none" stroke="#8a5a2b" stroke-width="2.2" marker-end="url(#m8a5a2b)" stroke-linejoin="round"/><text x="780.0" y="375" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8a5a2b" text-anchor="middle">store sha256(email:code), tries = 0</text><circle cx="622.975" cy="370" r="12" fill="#8a5a2b"/><text x="622.975" y="374.6" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><path d="M595,430 L1327,430" fill="none" stroke="#d96b00" stroke-width="2.2" marker-end="url(#md96b00)" stroke-linejoin="round"/><text x="965.0" y="420" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#d96b00" text-anchor="middle">SendEmail: &quot;123456 is your code&quot;</text><circle cx="819.72" cy="415" r="12" fill="#d96b00"/><text x="819.72" y="419.6" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><path d="M1335,458 L233,458" fill="none" stroke="#0f8a7e" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#m0f8a7e)" stroke-linejoin="round"/><text x="780.0" y="448" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f8a7e" text-anchor="middle">the code arrives in the ANU inbox</text><circle cx="630.8050000000001" cy="443" r="12" fill="#0f8a7e"/><text x="630.8050000000001" y="447.6" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text><path d="M225,530 L587,530" fill="none" stroke="#8a5a2b" stroke-width="2.2" marker-end="url(#m8a5a2b)" stroke-linejoin="round"/><text x="410.0" y="520" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8a5a2b" text-anchor="middle">the six digits</text><circle cx="335.19" cy="515" r="12" fill="#8a5a2b"/><text x="335.19" y="519.6" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text><path d="M595,575 L957,575" fill="none" stroke="#8a5a2b" stroke-width="2.2" marker-end="url(#m8a5a2b)" stroke-linejoin="round"/><text x="780.0" y="565" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8a5a2b" text-anchor="middle">under 10 min and 5 tries? same hash?</text><circle cx="619.06" cy="560" r="12" fill="#8a5a2b"/><text x="619.06" y="564.6" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">7</text><path d="M595,630 L233,630" fill="none" stroke="#8a5a2b" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#m8a5a2b)" stroke-linejoin="round"/><text x="410.0" y="620" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8a5a2b" text-anchor="middle">ok · or &quot;wrong / too old&quot; (try counted, logged)</text><circle cx="205.995" cy="615" r="12" fill="#8a5a2b"/><text x="205.995" y="619.6" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">8</text><path d="M225,715 L587,715" fill="none" stroke="#8a5a2b" stroke-width="2.2" marker-end="url(#m8a5a2b)" stroke-linejoin="round"/><text x="410.0" y="705" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8a5a2b" text-anchor="middle">code again + a name + a password (8+)</text><circle cx="245.14499999999998" cy="700" r="12" fill="#8a5a2b"/><text x="245.14499999999998" y="704.6" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">9</text><rect x="440" y="730" width="310" height="112" rx="10" fill="#fff" stroke="#8a5a2b" stroke-width="1.5" filter="url(#sh)"/><circle cx="458" cy="750" r="11" fill="#8a5a2b"/><text x="458" y="754.6" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">10</text><text x="476" y="755" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#2b2118" text-anchor="start">checks again, then creates</text><text x="454" y="776" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5246" text-anchor="start">code still right? name free, not qa_/guest?</text><text x="454" y="794" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5246" text-anchor="start">password → scrypt hash</text><text x="454" y="812" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5246" text-anchor="start">role: student, or staff if staff email</text><path d="M595,862 L957,862" fill="none" stroke="#8a5a2b" stroke-width="2.2" marker-end="url(#m8a5a2b)" stroke-linejoin="round"/><text x="780.0" y="852" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8a5a2b" text-anchor="middle">new member row · delete the code</text><circle cx="634.72" cy="847" r="12" fill="#8a5a2b"/><text x="634.72" y="851.6" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">11</text><path d="M595,890 L233,890" fill="none" stroke="#8a5a2b" stroke-width="2.2" marker-end="url(#m8a5a2b)" stroke-linejoin="round"/><text x="410.0" y="880" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#8a5a2b" text-anchor="middle">name + token → straight into the campus</text><circle cx="237.315" cy="875" r="12" fill="#8a5a2b"/><text x="237.315" y="879.6" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">12</text><rect x="30" y="925" width="500" height="130" rx="10" fill="#fff" stroke="#8a5a2b" stroke-width="1.4"/><rect x="30" y="925" width="6" height="130" rx="3" fill="#8a5a2b"/><text x="48" y="949" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#8a5a2b" text-anchor="start">What is kept</text><text x="48" y="971" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">the email (never shown to anyone, not in</text><text x="48" y="990" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">the admin&#x27;s log), the name, the password&#x27;s</text><text x="48" y="1009" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">scrypt hash. The code: only its hash,</text><text x="48" y="1028" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">dead after 10 minutes, deleted on success.</text><rect x="550" y="925" width="500" height="130" rx="10" fill="#fff" stroke="#4f72ad" stroke-width="1.4"/><rect x="550" y="925" width="6" height="130" rx="3" fill="#4f72ad"/><text x="568" y="949" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#4f72ad" text-anchor="start">Why email, not free names</text><text x="568" y="971" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">ANU Crossing is for the ANU community:</text><text x="568" y="990" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">a verified @anu.edu.au address proves it.</text><text x="568" y="1009" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">Staff get staff rights from their address.</text><text x="568" y="1028" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">Guests can still look around without one.</text><rect x="1070" y="925" width="500" height="130" rx="10" fill="#fff" stroke="#e07a10" stroke-width="1.4"/><rect x="1070" y="925" width="6" height="130" rx="3" fill="#e07a10"/><text x="1088" y="949" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#e07a10" text-anchor="start">Same path for a forgotten password</text><text x="1088" y="971" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">/api/password/start sends a reset code</text><text x="1088" y="990" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">(the same answer whether or not the</text><text x="1088" y="1009" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">account exists); finish sets a new hash</text><text x="1088" y="1028" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5246" text-anchor="start">and signs every other browser out.</text></svg>